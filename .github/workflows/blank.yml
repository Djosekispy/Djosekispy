name: Update README

on:
  schedule:
    - cron: '30 5,17 * * *'  
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Djosekispy/github-readme-stats-action@v1.0.0

      # Exemplo: Executar script que atualiza README.md
      - name: Atualizar README via script
        run: |
          echo "Atualizando README..."
          # seu comando ou script aqui, ex: python update_readme.py

      - name: Commit e push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "📚 Atualização automática do README"
          git push
