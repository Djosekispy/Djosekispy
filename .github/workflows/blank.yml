name: Update README

on:
  schedule:
    - cron: '30 5,17 * * *'  
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Use the GitHub Readme Stats Action
      - name: Update README using custom action
        uses: Djosekispy/github-readme-stats-action@v1.0.0

      # Example: Update README via script
      - name: Update README via script
        run: |
          echo "Updating README..."
          # Replace this with your script, e.g., python update_readme.py

      # Commit and push the changes
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "📚 Automatic README Update"
          git push
