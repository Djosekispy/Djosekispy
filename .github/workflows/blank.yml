name: Update README

on:
  schedule:
    - cron: '30 5,17 * * *'  # Executa às 5:30 e 17:30 UTC todos os dias
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # Atualização do README via script
      - name: Update README via script
        run: |
          set -e
          echo "Atualizando README..."
          echo "" >> README.md
          echo "📅 Última atualização automática: $(date -u)" >> README.md

      # Commit e push das alterações
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "📚 Automatic README Update"
          git push
